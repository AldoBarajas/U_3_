<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="870" viewBox="0 0 1260 870"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#46758e"/></marker><marker id="diamond" markerWidth="18" markerHeight="12" refX="16" refY="6" orient="auto"><path d="M0,6 L8,0 L16,6 L8,12 Z" fill="#d6f3e9" stroke="#46758e" stroke-width="1.5"/></marker></defs><rect width="1260" height="870" fill="white"/><text x="630" y="46" font-family="DejaVu Sans" font-size="26" font-weight="bold" text-anchor="middle" fill="#19364c">Diagrama UML — Cola de prioridad del restaurante</text><rect x="45" y="135" width="280" height="255" rx="5" fill="#f2f5f7" stroke="#45708a" stroke-width="2"/><line x1="45" y1="190" x2="325" y2="190" stroke="#45708a" stroke-width="2"/><text x="185.0" y="169" text-anchor="middle" font-family="DejaVu Sans" font-size="20" font-weight="bold" fill="#17354b">Program (consola)</text><text x="63" y="218" font-family="DejaVu Sans" font-size="17" fill="#263f52">- Turnos: priorityQueue</text><text x="63" y="248" font-family="DejaVu Sans" font-size="17" fill="#263f52">- proximoFolio: int</text><line x1="45" y1="268" x2="325" y2="268" stroke="#45708a" stroke-width="1.5"/><text x="63" y="293" font-family="DejaVu Sans" font-size="17" fill="#263f52">+ Registrar(): void</text><text x="63" y="323" font-family="DejaVu Sans" font-size="17" fill="#263f52">+ MostrarFila(): void</text><text x="63" y="353" font-family="DejaVu Sans" font-size="17" fill="#263f52">+ Demo(): void</text><rect x="425" y="100" width="395" height="333" rx="5" fill="#e0f2ec" stroke="#45708a" stroke-width="2"/><line x1="425" y1="155" x2="820" y2="155" stroke="#45708a" stroke-width="2"/><text x="622.5" y="134" text-anchor="middle" font-family="DejaVu Sans" font-size="20" font-weight="bold" fill="#17354b">RestaurantPriorityQueue</text><text x="443" y="183" font-family="DejaVu Sans" font-size="17" fill="#263f52">- head: Node?</text><text x="443" y="213" font-family="DejaVu Sans" font-size="17" fill="#263f52">+ Count: int</text><text x="443" y="243" font-family="DejaVu Sans" font-size="17" fill="#263f52">+ IsEmpty: bool</text><line x1="425" y1="263" x2="820" y2="263" stroke="#45708a" stroke-width="1.5"/><text x="443" y="288" font-family="DejaVu Sans" font-size="17" fill="#263f52">+ Enqueue(turno): void</text><text x="443" y="318" font-family="DejaVu Sans" font-size="17" fill="#263f52">+ Dequeue(): ClienteTurno</text><text x="443" y="348" font-family="DejaVu Sans" font-size="17" fill="#263f52">+ Peek(): ClienteTurno</text><text x="443" y="378" font-family="DejaVu Sans" font-size="17" fill="#263f52">+ GetEnumerator(): IEnumerator</text><rect x="925" y="140" width="290" height="180" rx="5" fill="#eef5fa" stroke="#45708a" stroke-width="2"/><line x1="925" y1="195" x2="1215" y2="195" stroke="#45708a" stroke-width="2"/><text x="1070.0" y="174" text-anchor="middle" font-family="DejaVu Sans" font-size="20" font-weight="bold" fill="#17354b">Node (privado)</text><text x="943" y="223" font-family="DejaVu Sans" font-size="17" fill="#263f52">+ Value: ClienteTurno</text><text x="943" y="253" font-family="DejaVu Sans" font-size="17" fill="#263f52">+ Next: Node?</text><rect x="330" y="525" width="445" height="295" rx="5" fill="#eef5fa" stroke="#45708a" stroke-width="2"/><line x1="330" y1="580" x2="775" y2="580" stroke="#45708a" stroke-width="2"/><text x="552.5" y="559" text-anchor="middle" font-family="DejaVu Sans" font-size="20" font-weight="bold" fill="#17354b">ClienteTurno</text><text x="348" y="608" font-family="DejaVu Sans" font-size="17" fill="#263f52">+ Folio: int</text><text x="348" y="638" font-family="DejaVu Sans" font-size="17" fill="#263f52">+ Nombre: string</text><text x="348" y="668" font-family="DejaVu Sans" font-size="17" fill="#263f52">+ Personas: int</text><text x="348" y="698" font-family="DejaVu Sans" font-size="17" fill="#263f52">+ Tipo: TipoTurno</text><text x="348" y="728" font-family="DejaVu Sans" font-size="17" fill="#263f52">+ Llegada: DateTime</text><line x1="330" y1="748" x2="775" y2="748" stroke="#45708a" stroke-width="1.5"/><text x="348" y="773" font-family="DejaVu Sans" font-size="17" fill="#263f52">+ ToString(): string</text><rect x="900" y="520" width="315" height="147" rx="5" fill="#fcf3db" stroke="#45708a" stroke-width="2"/><line x1="900" y1="575" x2="1215" y2="575" stroke="#45708a" stroke-width="2"/><text x="1057.5" y="554" text-anchor="middle" font-family="DejaVu Sans" font-size="20" font-weight="bold" fill="#17354b">«enum» TipoTurno</text><text x="918" y="603" font-family="DejaVu Sans" font-size="17" fill="#263f52">Reserva = 0</text><text x="918" y="633" font-family="DejaVu Sans" font-size="17" fill="#263f52">SinReserva = 1</text><path d="M325 260 L424 260" stroke="#46758e" fill="none" stroke-width="2.8" stroke-dasharray="8 6" marker-end="url(#arrow)"/><text x="355" y="243" font-family="DejaVu Sans" font-size="17" fill="#234f68">usa</text><path d="M820 233 L924 233" stroke="#46758e" fill="none" stroke-width="2.8"  marker-end="url(#arrow)"/><polygon points="826,233 843,220 860,233 843,246" fill="#d6f3e9" stroke="#46758e" stroke-width="2.3"/><text x="825" y="90" font-family="DejaVu Sans" font-size="16" fill="#234f68">composición: 0..* nodos</text><path d="M1060 320 L1060 478 L660 478 L660 524" stroke="#46758e" fill="none" stroke-width="2.8" stroke-dasharray="8 6" marker-end="url(#arrow)"/><text x="818" y="464" font-family="DejaVu Sans" font-size="17" fill="#234f68">Value = 1</text><path d="M775 625 L899 625" stroke="#46758e" fill="none" stroke-width="2.8" stroke-dasharray="8 6" marker-end="url(#arrow)"/><text x="817" y="605" font-family="DejaVu Sans" font-size="17" fill="#234f68">Tipo</text><text x="45" y="850" font-family="DejaVu Sans" font-size="14" fill="#6a8491">Relación de contención (rombo), asociación de uso (línea discontinua). Multiplicidades según el modelo implementado.</text></svg>